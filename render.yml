

services:


  - type: web
    name: stock-intelligence-backend
    runtime: python
    rootDir: backend             
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        generateValue: true      
    healthCheckPath: /companies   
    autoDeploy: true              

  #  React Frontend (Static Site) 
  - type: web
    name: stock-intelligence-frontend
    runtime: static
    rootDir: frontend             
    buildCommand: npm install && npm run build
    staticPublishPath: dist       # Vite output folder
    plan: free
    envVars:
      - key: VITE_API_URL
       
        value: https://stock-intelligence-backend.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true